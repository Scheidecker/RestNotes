# Author: Carlos Scheidecker
server:
  port: "${SERVER_PORT:${PORT:8081}}"
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: RestNotes
  profiles:
    default: "${SPRING_PROFILES_ACTIVE:dev}"
  lifecycle:
    timeout-per-shutdown-phase: 20s
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/RestNotes}"
    username: "${DB_USERNAME:}"
    password: "${DB_PASSWORD:}"
    hikari:
      maximum-pool-size: "${DB_POOL_SIZE:10}"
      connection-timeout: "${DB_CONNECTION_TIMEOUT_MS:10000}"
      initialization-fail-timeout: 60000
      connection-init-sql: "SET time_zone = '+00:00'"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  liquibase:
    change-log: classpath:db/changelog/schema.yml
    enabled: "${MIGRATIONS_ENABLED:false}"
    analytics-enabled: false
    show-summary: "off"

logging:
  level:
    root: "${LOG_LEVEL:INFO}"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  info:
    env:
      enabled: true
    java:
      enabled: false
    os:
      enabled: false
    process:
      enabled: false

info:
  app:
    name: RestNotes
    author: Carlos Scheidecker
    phase: note-tags

restnotes:
  demo:
    enabled: "${DEMO_DATA_ENABLED:false}"
  security:
    registration-enabled: "${REGISTRATION_ENABLED:false}"
    bcrypt-strength: "${BCRYPT_STRENGTH:10}"
    jwt:
      issuer: "${JWT_ISSUER:RestNotes}"
      audience: "${JWT_AUDIENCE:RestNotes-api}"
      ttl-seconds: "${JWT_TTL_SECONDS:900}"
      private-key-location: "${JWT_PRIVATE_KEY_LOCATION:}"
      public-key-location: "${JWT_PUBLIC_KEY_LOCATION:}"

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    disable-swagger-default-url: true
    persist-authorization: false
  show-actuator: false

---
# Local development and test only. UAT/production retain the disabled defaults.
spring:
  config:
    activate:
      on-profile: "(dev | test) & !uat & !prod"
  datasource:
    username: "${DB_USERNAME:APIUser}"
    password: "${DB_PASSWORD:MyAPIPassword#8}"
  liquibase:
    enabled: "${MIGRATIONS_ENABLED:true}"
springdoc:
  api-docs:
    enabled: "${OPENAPI_ENABLED:true}"
  swagger-ui:
    enabled: "${OPENAPI_ENABLED:true}"
restnotes:
  security:
    registration-enabled: "${REGISTRATION_ENABLED:true}"
